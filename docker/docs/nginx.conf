server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-ish fallback for clean URLs.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
